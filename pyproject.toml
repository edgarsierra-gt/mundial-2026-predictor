[project]
name = "mundial-2026-predictor"
version = "0.1.0"
description = "Modelo probabilistico para predicciones del Mundial 2026"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "numpy",
  "openpyxl",
  "pydantic",
  "python-slugify"
]

[project.optional-dependencies]
dev = [
  "pytest",
  # ruff is pinned on purpose: it was unpinned, so CI installed the newest
  # release on every run and a later version enabled new default rules (RUF059
  # and others). That turned "Run tests" red twice a day without a single line
  # of code changing. Bump this deliberately, not by accident.
  "ruff==0.15.18",
  "black"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
